<rect x="525" y="83" width="86" height="14" rx="3" fill="#0F3D3A" stroke="#2DD4BF" stroke-width="1"/>
<text x="439" y="93" font-size="8.5" fill="#93A4B3" text-anchor="middle">Today</text>
<text x="476" y="93" font-size="8.5" fill="#93A4B3" text-anchor="middle">1W</text>
<text x="508" y="93" font-size="8.5" fill="#93A4B3" text-anchor="middle">2W</text>
<text x="568" y="93" font-size="8.5" font-weight="bold" fill="#2DD4BF" text-anchor="middle">Full →Exp</text>

