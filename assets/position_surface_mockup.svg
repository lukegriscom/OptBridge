<svg viewBox="0 0 680 598" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif">
<title>OptBridge Position Surface mockup with Horizon control</title>
<desc>A forward-only options P&amp;L heatmap for a SPY 565 call, 24 days to expiry, shown in the macro (full-life) timeframe with a dates axis. Includes iso-R profit contours, a live implied-volatility probability cone, a live spot marker, an expiry payoff strip, a Horizon toggle for micro/macro timeframes, a position rail with mixed DTEs, and a live greeks and risk row.</desc>
<defs>
<linearGradient id="valueGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.60"/>
<stop offset="20%" stop-color="#2DD4BF" stop-opacity="0.38"/>
<stop offset="30%" stop-color="#14B8A6" stop-opacity="0.16"/>
<stop offset="37%" stop-color="#0B1116" stop-opacity="0"/>
<stop offset="45%" stop-color="#F43F5E" stop-opacity="0.14"/>
<stop offset="72%" stop-color="#F43F5E" stop-opacity="0.34"/>
<stop offset="100%" stop-color="#F43F5E" stop-opacity="0.52"/>
</linearGradient>
<linearGradient id="expiryGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.85"/>
<stop offset="40%" stop-color="#2DD4BF" stop-opacity="0.30"/>
<stop offset="44%" stop-color="#F43F5E" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#F43F5E" stop-opacity="0.55"/>
</linearGradient>
<radialGradient id="spotGlow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.9"/>
<stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
</radialGradient>
<clipPath id="plot"><rect x="52" y="104" width="560" height="342" rx="4"/></clipPath>
</defs>

<rect x="0" y="0" width="680" height="598" fill="#0A0F14"/>

<!-- top bar -->
<rect x="0" y="0" width="680" height="38" fill="#0E1519"/>
<line x1="0" y1="38" x2="680" y2="38" stroke="#1E2A33" stroke-width="1"/>
<path d="M14,25 L24,11 L24,25 Z" fill="#2DD4BF"/>
<text x="30" y="24" font-size="14" font-weight="bold" fill="#2DD4BF">OptBridge</text>
<text x="250" y="24" font-size="10" fill="#5B6B7A">Positions</text>
<text x="316" y="24" font-size="10" font-weight="bold" fill="#E6EEF7">Surface</text>
<text x="372" y="24" font-size="10" fill="#5B6B7A">Analytics</text>
<text x="438" y="24" font-size="10" fill="#5B6B7A">Monte Carlo</text>
<text x="536" y="24" font-size="10" fill="#93A4B3">SPY </text>
<text x="560" y="24" font-size="10" font-weight="bold" fill="#E6EEF7">559.20</text>
<circle cx="612" cy="20" r="3.5" fill="#34D399"/>
<text x="620" y="24" font-size="9.5" fill="#34D399">LIVE 13:47 ET</text>

<!-- position rail (mixed DTE chips) -->
<rect x="14" y="48" width="158" height="28" rx="6" fill="#0F2A2A" stroke="#2DD4BF" stroke-width="1.2"/>
<text x="24" y="65" font-size="10" fill="#E6EEF7">SPY 565C · 24DTE</text>
<text x="164" y="65" font-size="10" font-weight="bold" fill="#2DD4BF" text-anchor="end">+0.6R</text>
<rect x="180" y="48" width="132" height="28" rx="6" fill="#0E1519" stroke="#1E2A33" stroke-width="1"/>
<text x="189" y="65" font-size="10" fill="#93A4B3">QQQ 490C · 4DTE</text>
<text x="304" y="65" font-size="10" font-weight="bold" fill="#2DD4BF" text-anchor="end">+1.2R</text>
<rect x="320" y="48" width="128" height="28" rx="6" fill="#0E1519" stroke="#1E2A33" stroke-width="1"/>
<text x="329" y="65" font-size="10" fill="#93A4B3">AAPL 230C · 0DTE</text>
<text x="440" y="65" font-size="10" fill="#FB7185" text-anchor="end">−0.4R</text>
<text x="460" y="60" font-size="7.5" fill="#5B6B7A">CONSIDERING</text>
<rect x="522" y="48" width="142" height="28" rx="6" fill="#0B1116" stroke="#5B6B7A" stroke-width="1" stroke-dasharray="3 3"/>
<text x="531" y="65" font-size="10" fill="#93A4B3">NVDA 130C · 31DTE</text>
<text x="656" y="65" font-size="9" fill="#5B6B7A" text-anchor="end">sim</text>

<!-- surface title -->
<text x="52" y="94" font-size="12" font-weight="bold" fill="#E6EEF7">SPY 565C  ·  24DTE  ·  exp Jul 26</text>

