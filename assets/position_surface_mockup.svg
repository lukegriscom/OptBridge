<text x="332" y="459" font-size="8.5" fill="#5B6B7A" text-anchor="middle">Jul 14</text>
<text x="472" y="459" font-size="8.5" fill="#5B6B7A" text-anchor="middle">Jul 20</text>
<text x="612" y="459" font-size="8.5" fill="#5B6B7A" text-anchor="end">Jul 26 exp</text>

