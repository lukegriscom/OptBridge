<svg viewBox="0 0 680 598" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif">
<title>OptBridge Position Surface mockup with Horizon control</title>
<desc>A forward-only options P&amp;L heatmap for a GOOG 350 call, 17 days to expiry, shown in the macro (full-life) timeframe with a dates axis. Prices are a real market snapshot from 2026-08-17. Includes iso-R profit contours, a live implied-volatility probability cone, a live spot marker, an expiry payoff strip, a Horizon toggle for micro/macro timeframes, a position rail with mixed DTEs, and a live greeks and risk row.</desc>
<defs>
<linearGradient id="valueGrad" x1="0" y1="0" x2="0" y2="1">
